name: release

# manual-only (no schedule): run it when you decide to cut a release.
# The run automatically detects a newer CPython3.12.x security patch and
# patches the Dockerfile ARGs (version + sha256) before building, so both
# upstream layers are absorbed in one click:
#   layer1 alpine libs  -> rebuild pulls fresh FROM + apk packages
#   layer2 CPython      -> auto-detected from python/cpython stable tags
on:
  workflow_dispatch:
    inputs:
      version:
        description: "release tag to build & push, e.g. v2.26"
        required: true

permissions:
  contents: write   # push the auto CPython-bump commit
  packages: write   # push ghcr.io images

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: validate version input
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          echo "$VER" | grep -Eq '^v[0-9]+\.[0-9]+$' \
            || { echo "::error::version must look like v2.26 (got '$VER')"; exit1; }

      - name: detect new CPython3.12.x security patch
        env:
          VER: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cur=$(sed -n 's/^ARG PYTHON_VERSION=//p' Dockerfile)
          # stable v3.12.x only (rc/beta excluded); api+token =1000 req/h in CI
          latest=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/python/cpython/git/matching-refs/tags/v3.12.?per_page=100" \
            | python3 -c "
          import json, sys, re
          refs = [r['ref'][len('refs/tags/'):] for r in json.load(sys.stdin)]
          stable = [v for v in refs if re.fullmatch(r'v3\\.12\\.\\d+', v)]
          if not stable:
              sys.exit('no stable v3.12.x refs parsed')
          print(max(stable, key=lambda s: tuple(map(int, s[1:].split('.')))))")
          echo "dockerfile pins: $cur | newest stable: $latest"
          if [ "$latest" = "$cur" ]; then
            echo "cpython_up_to_date"
            exit0
          fi
          url="https://www.python.org/ftp/python/$latest/Python-$latest.tgz"
          sha=$(curl -fsSL "$url" | sha256sum | awk '{print $1}')
          echo "bumping cpython $cur -> $latest (sha256=$sha)"
          sed -i "s/^ARG PYTHON_VERSION=.*/ARG PYTHON_VERSION=$latest/" Dockerfile
          sed -i "s/^ARG PYTHON_SHA256=.*/ARG PYTHON_SHA256=$sha/" Dockerfile
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dockerfile
          git commit -m "Bump CPython to $latest (upstream security patch)"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: lint (js syntax + py compile)
        run: |
          set -euo pipefail
          for f in frontend/js/*.js; do node --check "$f"; done
          python3 -m py_compile backend/app.py backend/verify.py

      - name: regression suite
        run: |
          set -euo pipefail
          python3 -m pip install -q -r backend/requirements.txt
          python3 backend/verify.py

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build & push (fresh alpine libs absorbed on every run)
        env:
          VER: ${{ inputs.version }}
        run: |
          set -euo pipefail
          docker buildx build --push \
            --build-arg APP_VERSION="$VER" \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            -t "ghcr.io/${{ github.repository }}:$VER" \
            -t "ghcr.io/${{ github.repository }}:latest" .

      - name: summary
        env:
          VER: ${{ inputs.version }}
        run: |
          echo "## pushed ghcr.io/${{ github.repository }}:$VER (+ latest)" >> "$GITHUB_STEP_SUMMARY"
          echo "redeploy via Portainer + nginx reload (image tag bump)" >> "$GITHUB_STEP_SUMMARY"
